<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cime — Budget suisse</title>
<meta name="description" content="Cime : budget, fortune, impôts et assurances, pensé pour la Suisse.">
<meta name="theme-color" content="#0E7490">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%230E7490%22/%3E%3Cpath d=%22M2 20 9.5 7l3.6 6.2L15.5 9 22 20z%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --card:#FFFFFF; --card2:#F8FAFC; --ink:#0F1B2D; --muted:#475569; --line:#E2E8F0; --line2:#EEF2F6; --nav:#E9EEF4;
  --red:#B42318; --red-soft:#FDECEA; --green:#15803D; --green-soft:#E7F6EC;
  --orange:#B45309; --orange-soft:#FEF3E2; --gold:#0E7490; --gold-soft:#E6F4F7; --gold-line:#B6DFE8;
  --blue:#1D4ED8; --grid:#E8EDF3; --axis:#64748B; --input:#FFFFFF; --inborder:#94A3B8; --radius:14px; color-scheme:light;
}
[data-theme=dark]{
  --bg:#0B1220; --card:#111A2B; --card2:#162236; --ink:#E6EDF5; --muted:#A3B1C4; --line:#24324A; --line2:#1C2940; --nav:#152036;
  --red:#F26D63; --red-soft:#3A1A1C; --green:#4ACB83; --green-soft:#12301F; --orange:#F0A34A; --orange-soft:#38280F;
  --gold:#38BDD8; --gold-soft:#0F2E3A; --gold-line:#1F5566; --blue:#7AA7FF; --grid:#1E2B42; --axis:#8A9AB0; --input:#0E1726; --inborder:#4A5B76; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:var(--blue)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
h1{font-size:22px} h2{font-size:18px;margin-bottom:12px} h3{font-size:15px;margin-bottom:8px}
.wrap{max-width:1400px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--gold);display:grid;place-items:center}
.logo svg{width:22px;height:22px}
.sub{color:var(--muted);font-size:12.5px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.ok{background:var(--green)}
#bkDrop.over{background:var(--gold-soft);border-color:var(--accent,#0E7490)}
.seg{display:inline-flex;background:var(--nav);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:7px;cursor:pointer}


.sit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sit{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:var(--ink)}
.sit:hover{border-color:var(--gold)}
.sit .tick{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--inborder);flex:none;display:grid;place-items:center;font-size:13px;color:#fff;margin-top:1px}
.sit.on{border-color:var(--gold);background:var(--gold-soft)}.sit.on .tick{background:var(--gold);border-color:var(--gold)}
.sit b{display:block;font-size:13.5px}.sit span{font-size:12px;color:var(--muted)}
.card-tog{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;margin-left:6px;padding:2px 6px;border-radius:6px;transition:transform .15s}
.card-tog:hover{background:var(--line2);color:var(--ink)}
.card.collapsed .card-tog{transform:rotate(-90deg)}
.card.collapsed>*:not(.card-head){display:none!important}
.card.collapsed{padding-bottom:14px}
.card-head h2{cursor:pointer}
a.jump,.jump{color:inherit;text-decoration:underline dotted var(--gold);text-underline-offset:3px;cursor:pointer}
a.jump:hover{color:var(--gold)}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}

td input.amt{margin-left:auto;display:block}
td.num,th.num{text-align:right}
.pop{display:none;position:absolute;right:0;top:110%;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:10px;width:260px}
.pop.open{display:block}
.pop .colrow{display:flex;align-items:center;gap:6px;padding:4px 2px;font-size:13px}
.pop .colrow button{border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;width:24px;height:24px;color:var(--ink)}
#expHead th[draggable=true]{cursor:grab}#expHead th.dragover{box-shadow:inset 3px 0 var(--gold)}
.gl{text-decoration:underline dotted var(--muted);text-underline-offset:3px;cursor:help}
#glTip{position:fixed;z-index:40;max-width:300px;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:9px;pointer-events:none;display:none;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.sec-src{margin-top:16px;font-size:11.5px;color:var(--muted)}.sec-src a{color:var(--muted)}
.src-item{border-bottom:1px solid var(--line2);padding:8px 0;font-size:13px}.src-item .note{font-size:12px}
.nav-foot{border-top:1px solid var(--line);margin-top:8px;padding:10px 6px 2px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
body.simple .adv{display:none!important}
.help-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);width:22px;height:22px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;margin-left:8px;flex:none}
.help-btn:hover{color:var(--gold);border-color:var(--gold)}
.card p.help{display:none}.card.show-help p.help{display:block}
@media (hover:hover) and (min-width:641px){
  td input:not([type=checkbox]),td select{border-color:transparent!important;background:transparent!important;box-shadow:none}
  td select{appearance:none;-webkit-appearance:none;background-image:none;padding-right:6px;cursor:pointer}
  td input.amt{border-left:3px solid var(--gold-line)!important}
  tr:hover td input:not([type=checkbox]):not(:disabled),tr:hover td select:not(:disabled),td input:focus,td select:focus{border-color:var(--inborder)!important;background:var(--input)!important}
  tr:hover td input.amt,td input.amt:focus{border-left-color:var(--gold)!important}
}
.kpi[data-goto],.check[data-goto]{cursor:pointer}.kpi[data-goto]:hover{border-color:var(--gold)}.check[data-goto]:hover{filter:brightness(.97)}
.flowbar{display:flex;height:42px;border-radius:10px;overflow:hidden}
.flowbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:pointer}
.verdict{display:flex;gap:14px;align-items:center;border-radius:12px;padding:14px 16px;border:1px solid}
.verdict.g{background:var(--green-soft);border-color:var(--green)}.verdict.o{background:var(--orange-soft);border-color:var(--orange)}.verdict.r{background:var(--red-soft);border-color:var(--red)}
.light{width:16px;height:16px;border-radius:50%;flex:none;display:inline-block}
.light.g{background:var(--green)}.light.o{background:var(--orange)}.light.r{background:var(--red)}
tr.rowg td:first-child{box-shadow:inset 4px 0 var(--green)}tr.rowo td:first-child{box-shadow:inset 4px 0 var(--orange)}tr.rowr td:first-child{box-shadow:inset 4px 0 var(--red)}
.seg button:disabled{opacity:.35;cursor:default}
.hist-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.hist-item ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}
nav{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);padding:10px;border-radius:14px;position:sticky;top:12px}
.ngroup{border-radius:11px;margin-bottom:4px}
.ngroup.has-active{background:var(--card2)}
.grp-h{display:flex!important;align-items:center;gap:10px;width:100%;font-size:13.5px!important;font-weight:700!important;color:var(--ink)!important;padding:10px 10px!important;letter-spacing:.01em}
.grp-h svg{width:20px;height:20px;flex:none;color:var(--gold);background:var(--gold-soft);border-radius:7px;padding:3px;box-sizing:content-box}
.grp-h .chev{margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s}
.ngroup.closed .chev{transform:rotate(-90deg)}
.ngroup.closed .grp-items{display:none}
.grp-items{display:flex;flex-direction:column;gap:1px;margin:0 0 6px 21px;padding-left:12px;border-left:2px solid var(--line)}
.grp-items button{font-size:13.5px}
#menuBtn,#curTab,.nav-backdrop{display:none}
main{min-width:0}
.card{overflow-x:auto}
@media(max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-flex;align-items:center;gap:6px}
  #curTab{display:block;font-weight:700;font-size:15px;margin:0 0 12px;color:var(--gold)}
  nav{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);z-index:30;overflow-y:auto;border-radius:0 16px 16px 0;transform:translateX(-105%);transition:transform .2s;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  body.nav-open nav{transform:none}
  body.nav-open .nav-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
}
@media(max-width:640px){
  .wrap{padding:12px 12px 70px}
  header{position:sticky;top:0;z-index:20;background:var(--bg);margin:-12px -12px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  header .sub,.status #saveTxt{display:none}
  h1{font-size:20px} .logo{width:32px;height:32px}
  header>.row{gap:6px}
  .g4{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:19px}
  .card{padding:14px}
  input,select,textarea{font-size:16px}
  .bar-row{grid-template-columns:105px 1fr 74px}
  .sum-box{grid-template-columns:1fr 1fr!important}
  .verdict{flex-wrap:wrap}
  svg{max-width:100%}
  .modal{padding:14px}
  .hide-sm{display:none}
  .card{overflow-x:visible}
  table.stack-sm thead{display:none}
  table.stack-sm tbody tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  table.stack-sm tbody td{border:0;padding:0;min-width:0;text-align:left}
  table.stack-sm tbody td:first-child{grid-column:1/-1}
  table.stack-sm tbody td[data-label]:not([data-label=""])::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
  table.stack-sm input,table.stack-sm select,table.stack-sm .w-lbl{width:100%!important;min-width:0!important}
  table.stack-sm .row{flex-wrap:wrap!important}
  table.stack-sm tfoot td{display:inline-block;border:0}
}
nav button{border:0;background:transparent;padding:8px 10px;border-radius:9px;font:inherit;font-weight:500;color:var(--ink);cursor:pointer;text-align:left}
nav button:hover{background:var(--line2)}
nav button.active{background:var(--gold-soft);color:var(--gold);font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:1.55fr 1fr}
@media(max-width:900px){.g2,.g3,.g-main{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.kpi .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi .val{font-size:23px;font-weight:700;letter-spacing:-.02em}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--green)} .neg{color:var(--red)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{border-bottom:0}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--input);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
input.amt{background:var(--input);border-color:var(--inborder);border-left:3px solid var(--gold);text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
input:not(.amt),select,textarea{border-color:var(--inborder)}
input:disabled,select:disabled{opacity:.6;background:var(--line2)}
input[type=checkbox]{width:auto}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.small{padding:4px 9px;font-size:12.5px}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}
.icon-btn:hover{color:var(--red);background:var(--red-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px}
.check.good{background:var(--green-soft)} .check.warn{background:var(--orange-soft)} .check.bad{background:var(--red-soft)}
.check .ic{font-weight:700;width:18px;flex:none;text-align:center}
.check.good .ic{color:var(--green)} .check.warn .ic{color:var(--orange)} .check.bad .ic{color:var(--red)}
.check b{display:block;font-weight:600}
.check span{font-size:12.5px;color:var(--muted)}
.score{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.bar-row{display:grid;grid-template-columns:140px 1fr 96px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.track{height:12px;background:var(--line2);border-radius:6px;overflow:hidden;display:flex}
.fill{height:100%}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--line2);color:var(--muted);font-weight:500;white-space:nowrap}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--line2);color:var(--blue)}
.note{font-size:12.5px;color:var(--muted)}
.callout{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:12px 14px;font-size:13px}
.best{background:var(--green-soft)!important;font-weight:700;color:var(--green)}
.tab{display:none} .tab.active{display:block}
.ai-out{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:120px;font-size:13.5px;line-height:1.55}
.ai-out h4{margin:10px 0 4px;font-size:14px}
svg text{font-family:Inter,sans-serif}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:14px;padding:20px;max-width:640px;width:100%}
.modal textarea{height:220px;font-family:ui-monospace,monospace;font-size:12px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.small{font-size:12px}
.tbl-scroll{overflow-x:auto}
.w-lbl{min-width:170px}.w-cat{width:150px}.w-freq{width:110px}.w-mon{width:78px}.w-acc{width:165px}.w-amt{width:100px}
.when{display:flex;gap:6px;align-items:center;white-space:nowrap}
.when .pill{padding:5px 10px}
.filter{margin-left:8px}
.sum-box{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.sum-box div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
.sum-box b{display:block;font-size:17px}
.sum-box span{font-size:11.5px;color:var(--muted)}
@media(max-width:700px){.sum-box{grid-template-columns:1fr 1fr}}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:10px 0}
.stack div{height:100%}
.src{font-size:11.5px;color:var(--muted);margin-top:8px}
.badge-date{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <button class="btn small" id="menuBtn" aria-label="Menu">☰</button>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M2 20 9.5 7l3.6 6.2L15.5 9 22 20z" fill="#fff"/><path d="M9.5 7 7.6 10.3l1.9-1 1.9 1z" fill="#0E7490" opacity=".55"/></svg></div>
    <div><h1>Cime</h1><div class="sub" data-i18n="tagline"></div></div>
  </div>
  <div class="row">
    <div class="status"><span class="dot" id="saveDot"></span><span id="saveTxt"></span></div>
    <div class="seg" id="langSeg"><button data-lang="fr">FR</button><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
    <div class="seg" id="themeSeg"><button data-theme="light" title="Light">☀</button><button data-theme="dark" title="Dark">☾</button></div>
    <div class="seg"><button id="btnUndo" title="Ctrl+Z">↶</button><button id="btnRedo" title="Ctrl+Shift+Z">↷</button></div>
    <button class="btn small" id="btnHist" title="Historique"><span aria-hidden="true">🕘</span><span class="hide-sm"> <span data-i18n="history"></span></span></button>
    <button class="btn small" id="btnExport" title="PDF"><span aria-hidden="true">⤓</span><span class="hide-sm"> <span data-i18n="export"></span></span></button>
    <button class="btn small" id="btnData" title="Données" style="position:relative"><span class="bk-dot" id="bkDot" style="display:none;position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--orange,#c2410c)"></span><span aria-hidden="true">⇅</span><span class="hide-sm"> <span data-i18n="data"></span></span></button>
  </div>
</header>

<div class="layout">
<nav id="nav">
  <div class="ngroup" data-grp="overview">
    <button class="grp-h" data-grp-toggle="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg><span data-i18n="g_overview"></span><span class="chev">▾</span></button>
    <div class="grp-items">
      <button data-tab="dash" data-i18n="tab_dash" class="active"></button>
      <button data-tab="profile" data-i18n="tab_profile"></button>
    </div>
  </div>
  <div class="ngroup" data-grp="budget">
    <button class="grp-h" data-grp-toggle="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12H3z"/><path d="M3 7l3-4h12l3 4"/><path d="M16 13h2"/></svg><span data-i18n="g_budget"></span><span class="chev">▾</span></button>
    <div class="grp-items">
      <button data-tab="budget" data-i18n="tab_budget"></button>
      <button data-tab="journal" data-i18n="tab_journal"></button>
      <button data-tab="cash" data-i18n="tab_cash"></button>
    </div>

sc_housing:["Ton logement représenterait {p} du nouveau revenu (repère : 25 à 33 %). C'est le poste le plus lourd à revoir si la situation dure : loyer, sous-location, déménagement ou, si propriétaire, renégociation de l'hypothèque.","Housing would be {p} of the new income (benchmark: 25 to 33%). It's the biggest item to review if this lasts: rent, subletting, moving or, for owners, renegotiating the mortgage.","Das Wohnen wäre {p} des neuen Einkommens (Richtwert 25–33 %). Grösster Hebel, falls es länger dauert: Miete, Untermiete, Umzug oder Hypothek neu verhandeln."],
sc_tips_t:["À faire dans cette situation","What to do in this situation","Was jetzt zu tun ist"],
sc_tips_change:["Compare le net, pas le brut : LPP, IJM et frais remboursés changent d'un employeur à l'autre.|Ton avoir LPP est transféré vers la nouvelle caisse : vérifie que c'est fait (sinon il part sur un compte de libre passage).|Si le trajet change, adapte la ligne transport et la déduction des frais de déplacement.|Adapte tes acomptes d'impôts si le revenu change de plus de ~10 %.","Compare net, not gross: pension, sickness cover and expense refunds differ by employer.|Your pension assets move to the new fund: check it's done (otherwise they go to a vested benefits account).|If the commute changes, update the transport line and the commute deduction.|Adjust tax instalments if income changes by more than ~10%.","Vergleiche Netto statt Brutto: BVG, KTG und Spesen sind je nach Arbeitgeber anders.|Dein BVG-Guthaben geht an die neue Kasse: prüfe die Überweisung (sonst Freizügigkeitskonto).|Bei neuem Arbeitsweg Transportzeile und Fahrkostenabzug anpassen.|Steuer-Akonto anpassen, wenn sich das Einkommen um mehr als ~10 % ändert."],
sc_tips_loss:["Inscris-toi à l'ORP dès la résiliation (au plus tard le 1er jour sans travail) et documente tes recherches d'emploi, même pendant le préavis.|Ta LPP part sur un compte de libre passage ; l'assurance chômage couvre décès/invalidité et les accidents (SUVA).|Après la fin du droit, pense à ajouter la couverture accidents à ta LAMal.|Demande la réduction de primes LAMal (subside) et l'adaptation des acomptes d'impôts.|Les versements 3a restent possibles avec des indemnités de chômage, mais ils peuvent être suspendus sans pénalité.","Register with the RAV/ORP as soon as you're dismissed (at the latest on your first day without work) and document your job search, even during notice.|Your pension goes to a vested benefits account; unemployment insurance covers death/disability and accidents (SUVA).|When entitlement ends, add accident cover to your health insurance.|Apply for health premium subsidies and for lower tax instalments.|3a contributions remain possible on unemployment benefits, but can be paused without penalty.","Melde dich sofort nach der Kündigung beim RAV (spätestens am ersten Tag ohne Arbeit) und dokumentiere die Stellensuche, auch während der Kündigungsfrist.|Dein BVG kommt auf ein Freizügigkeitskonto; die ALV deckt Tod/Invalidität und Unfälle (SUVA).|Nach Ende des Anspruchs Unfalldeckung in der Grundversicherung einschliessen.|Prämienverbilligung und tiefere Steuer-Akontozahlungen beantragen.|3a-Einzahlungen sind mit ALV-Taggeldern möglich, dürfen aber pausiert werden."],
sc_tips_retire:["Annonce ta retraite à la caisse AVS 3 à 4 mois avant, et choisis à temps rente ou capital LPP (souvent 3 ans avant, selon le règlement).|Capital LPP et 3a : imposés à part à taux réduit ; échelonner les retraits sur plusieurs années réduit l'impôt.|Ajoute la couverture accidents à ta LAMal dès la fin du contrat de travail.|Les frais de trajet et de repas disparaissent ; les impôts baissent mais toutes les rentes sont imposables.|La 13e rente AVS est versée chaque décembre : prévois-la pour les impôts ou les vacances.","Notify your AHV office 3–4 months ahead and choose pension or lump sum in time (often 3 years before, per fund rules).|Pension and 3a lump sums: taxed separately at a reduced rate; spreading withdrawals over several years lowers tax.|Add accident cover to your health insurance when your job ends.|Commuting and meal costs disappear; taxes fall but all pensions are taxable.|The 13th AHV pension is paid each December: plan it for taxes or holidays.","Melde die Pensionierung 3–4 Monate vorher bei der AHV und wähle rechtzeitig Rente oder Kapital (oft 3 Jahre vorher, je nach Reglement).|BVG- und 3a-Kapital: separat und reduziert besteuert; gestaffelte Bezüge sparen Steuern.|Unfalldeckung ab Ende des Arbeitsvertrags in die Grundversicherung einschliessen.|Arbeitsweg und Verpflegung fallen weg; Steuern sinken, aber alle Renten sind steuerbar.|Die 13. AHV-Rente kommt jeweils im Dezember: für Steuern oder Ferien einplanen."],
sc_src:["Sources : OFAS, montants 2026 (rente AVS 1 260–2 520 CHF/mois, couple 3 780, 13e rente dès déc. 2026) · LACI : indemnités 70 % / 80 %, gain assuré max. 148 200 CHF/an, retenues AVS 5,3 %, ANP 2,47 %, LPP 0,55 % (OCE Genève) · LPP : taux minimal 1,25 % en 2026 puis 2 % dès 2027, taux de conversion légal 6,8 % sur la part obligatoire (souvent 5 à 6 % dans les caisses enveloppantes) · impôts : barème de ta commune (onglet Impôts & 3a). Estimation, pas un conseil.","Sources: FSIO 2026 amounts (AHV pension CHF 1,260–2,520/month, couple 3,780, 13th pension from Dec 2026) · Unemployment act: benefits 70%/80%, max insured CHF 148,200/yr, deductions AHV 5.3%, accident 2.47%, pension 0.55% (Geneva OCE) · Pension: minimum rate 1.25% in 2026 then 2% from 2027, legal conversion rate 6.8% on the mandatory part (often 5–6% in envelope funds) · taxes: your commune's scale. Estimate, not advice.","Quellen: BSV, Beträge 2026 (AHV-Rente 1 260–2 520 CHF/Monat, Ehepaar 3 780, 13. Rente ab Dez. 2026) · AVIG: Taggelder 70 %/80 %, max. versichert 148 200 CHF/Jahr, Abzüge AHV 5,3 %, NBU 2,47 %, BVG 0,55 % (OCE Genf) · BVG: Mindestzins 1,25 % 2026, 2 % ab 2027, Umwandlungssatz 6,8 % obligatorisch (umhüllend oft 5–6 %) · Steuern: Tarif deiner Gemeinde. Schätzung, keine Beratung."],

function inMonth(it,m){ // m calendar month 0..11
  const f=it.freq||"m", start=(num(it.month)||1)-1;
  if(f==="m") return num(it.amount);
  if(f==="o"||f==="a") return start===m?num(it.amount):0;
  const step=f==="q"?3:6;
  for(let k=start;k<start+12;k+=step) if(k%12===m) return num(it.amount);
  return 0;
}

  c.commonIn = c.incCommon + c.myContrib;

  c.persoExp = Object.values(c.byCatP).reduce((a,b)=>a+b,0);
  c.commonExp = Object.values(c.byCatC).reduce((a,b)=>a+b,0);
  c.hhKey = hhKey(c);
  c.accFund = {}; S.accounts.filter(a=>a.shared).forEach(a=>{ const me=S.transfers.filter(x=>x.to===a.id&&!isShared(x.from)).reduce((s,x)=>s+monthly(x),0); const other=S.incomes.filter(i=>i.account===a.id).reduce((s,i)=>s+monthly(i),0)+S.transfers.filter(x=>x.to===a.id&&isShared(x.from)).reduce((s,x)=>s+monthly(x),0);
    const out=S.expenses.filter(e=>e.account===a.id).reduce((s,e)=>s+monthly(e),0)+S.transfers.filter(x=>x.from===a.id).reduce((s,x)=>s+monthly(x),0);
    c.accFund[a.id]={me,other,out,net:me+other-out,share:(me+other)>0?me/(me+other):c.hhKey}; });
  c.byCat={}; c.myCatP={}; c.myCatC={}; CATS.forEach(k=>{c.byCat[k]=0;c.myCatP[k]=0;c.myCatC[k]=0;});

  S.accounts.filter(a=>a.type==="current").forEach(a=>{ const s=c.series[a.id]; const mn=Math.min(...s); if(!c.worst||mn<c.worst.v) c.worst={v:mn,k:s.indexOf(mn),acc:a}; });
  c.irregular = S.expenses.filter(e=>e.freq!=="m");
  c.irrMonthly = c.irregular.reduce((a,e)=>a+monthly(e),0);
  // goals
  c.goals = S.goals.map(g=>{ if(g.account&&acc(g.account)) g={...g,saved:num(acc(g.account).balance)}; const [y,m]=(g.date||"").split("-").map(Number); const months = y? Math.max(1,(y-CY)*12+(m-1-CM)) : 12; const rest=Math.max(0,num(g.target)-num(g.saved)); return {...g,months,rest,need:rest/months,prog:num(g.target)>0?Math.min(1,num(g.saved)/num(g.target)):0}; });
  c.goalNeed = c.goals.reduce((s,g)=>s+g.need,0);
  return c;
}
function lamalCost(fr,prime,costs){ return prime*12 + Math.min(costs,fr) + Math.min(Math.max(costs-fr,0)*0.1, QP_MAX); }
function lamalBest(costs){ let best=null; FRANCHISES.forEach(f=>{const p=num(S.lamal.primes[f]); if(p<=0) return; const c=lamalCost(f,p,costs); if(!best||c<best.cost) best={f,cost:c,prime:p};}); return best; }

const BONUSF={m:12,q:4,a:1};
function salaryCalc(ov){
  const s={...S.salary,...(ov||{})}, g=num(s.gross), n=Math.max(12,num(s.n)||12), annual=g*n, age=num(S.profile.age);
  const B=(ov&&ov.noBonus?[]:S.salBonus||[]).map(b=>({...b,per:num(b.amount),times:BONUSF[b.freq]||1})); B.forEach(b=>b.year=b.per*b.times);
  const bonusY=B.reduce((a,b)=>a+b.year,0), base=annual+bonusY;
  const capR = cap => base>0 ? Math.min(1,cap/base) : 1;
  const r = {avs:SOC.avs, ac:SOC.ac*capR(SOC.acCap), laa:num(s.laa)/100*capR(SOC.laaCap)};
  const legal = age<25?0:age<35?7:age<45?10:age<55?15:18;
  const mode = s.lppMode||((s.lpp===null||s.lpp===""||s.lpp===undefined)?"legal":"pct");
  const empRate = mode==="pct" ? num(s.lpp) : legal/2;
  let coord=0; if(annual>=SOC.lppMin){ coord=Math.max(Math.min(annual,SOC.lppMax)-SOC.lppCoord, SOC.lppCoordMin); }
  const lppY = mode==="chf" ? num(s.lppChf)*12 : coord*empRate/100;
  const lppEmployerY = mode==="chf" ? lppY : coord*Math.max(legal-empRate, empRate)/100;
  const X=S.salExtra||[];
  const extra=X.map(x=>[ "x_"+x.id, x.label||"—", x.mode==="chf"?num(x.value)*12:annual*num(x.value)/100, x ]);
  const lines = [["avs","AVS / AI / APG",annual*r.avs],["ac",t("sal_ac"),annual*r.ac],["laa",t("sal_laa_l"),annual*r.laa],["lpp",t("sal_lpp_l"),lppY],...extra];
  const ded = lines.reduce((a,l)=>a+l[2],0), net = annual-ded;
  const pctR = r.avs+r.ac+r.laa+X.filter(x=>x.mode!=="chf").reduce((a,x)=>a+num(x.value)/100,0);
  const chfM = X.filter(x=>x.mode==="chf").reduce((a,x)=>a+num(x.value),0);
  const netMonthly = g*(1-pctR) - lppY/12 - chfM;
  const net13 = g*(n-12)*(1-pctR);
  // bonus: same % payroll deductions (AVS, AC, LAA, % lines such as withholding tax); no LPP by default
  const bLines=[["avs","AVS / AI / APG",bonusY*r.avs],["ac",t("sal_ac"),bonusY*r.ac],["laa",t("sal_laa_l"),bonusY*r.laa],...X.filter(x=>x.mode!=="chf").map(x=>["x_"+x.id,x.label||"—",bonusY*num(x.value)/100])];
  const bonusDed=bLines.reduce((a,l)=>a+l[2],0), bonusNet=bonusY-bonusDed; B.forEach(b=>b.net=b.per*(1-pctR));
  const RF=(ov&&ov.noBonus?[]:S.salRefunds||[]).map(x=>({...x,year:num(x.amount)*({m:12,q:4,s:2,a:1}[x.freq]||12)})); const refundY=RF.reduce((a,x)=>a+x.year,0);
  const employer = base*(1+SOC.avs+SOC.ac*capR(SOC.acCap)+0.025) + lppEmployerY + refundY;
  return {annual,lines,ded,net,netMonthly,net13,n,employer,lppY,lppEmployerY,legal,empRate,coord,mode,B,bonusY,bLines,bonusDed,bonusNet,pctR,RF,refundY,paidY:net+bonusNet+refundY};
}

// ================= health checks =================
function checks(c){
  const out=[]; let G="budget"; const add=(lvl,a,b,go)=>out.push({lvl,a,b,go:go||G});
  if(c.incMe<=0) add("bad",t("ch_noinc"),t("ch_noinc_d"));
  else if(c.savingRate>=0.2) add("good",t("ch_rate",{p:pct(c.savingRate)}),t("ch_rate_g"));
  else if(c.savingRate>=0.1) add("warn",t("ch_rate",{p:pct(c.savingRate)}),t("ch_rate_w",{x:chf(c.incMe*0.2-(c.saving+Math.max(c.unalloc,0)))}));
  else add("bad",t("ch_rate",{p:pct(c.savingRate)}),t("ch_rate_b"));
  if(c.unalloc<0) add("bad",t("ch_def",{x:chf(-c.unalloc)}),t("ch_def_d"));
  else if(c.unalloc>200) add("warn",t("ch_unalloc",{x:chf(c.unalloc)}),t("ch_unalloc_d"));
  else add("good",t("ch_alloc"),t("ch_alloc_d"));
  if(c.owed-c.reimb>20) add("warn",t("ch_owed",{x:chf(c.owed-c.reimb)}),t("ch_owed_d"));
  if(!S.profile.count13&&c.inc13>0) add("good",t("ch_13",{x:chf(c.inc13)}),t("ch_13_d"));
  Object.entries(c.accFund||{}).forEach(([id,f])=>{ if(f.net<-20) add("bad",t("ch_fund",{n:esc(acc(id).name),x:chf(-f.net)}),t("ch_common_d")); });
  if(false && S.accounts.some(a=>a.shared) && c.commonBal < -20) add("bad",t("ch_common",{x:chf(-c.commonBal)}),t("ch_common_d"));
  G="accounts";
  if(c.incMe>0){ G="budget"; const p=pct(c.housing); if(c.housing<=0.3) add("good",t("ch_house",{p}),t("ch_house_g")); else if(c.housing<=0.35) add("warn",t("ch_house",{p}),t("ch_house_w")); else add("bad",t("ch_house",{p}),t("ch_house_b")); }
  if(c.carShare>0.12) add("warn",t("ch_car",{p:pct(c.carShare)}),t("ch_car_d"));
  G="accounts"; const x3=chf(c.mySpend*3);
  if(c.cushion>=3) add("good",t("ch_cush",{x:c.cushion.toFixed(1)}),t("ch_cush_g")); else if(c.cushion>=1) add("warn",t("ch_cush",{x:c.cushion.toFixed(1)}),t("ch_cush_w",{x:x3})); else add("bad",t("ch_cush",{x:c.cushion.toFixed(1)}),t("ch_cush_b",{x:x3}));
  G="p3a"; if(c.p3aMax>0){ const r=c.p3aYear/c.p3aMax; if(r>=0.99) add("good",t("ch_3a_full"),`${chf(Math.min(c.p3aYear,c.p3aMax))} / ${chf(c.p3aMax)} CHF`); else add(r>=0.5?"warn":"bad",t("ch_3a",{p:pct(r)}),t("ch_3a_d",{x:chf(c.p3aMax-c.p3aYear),y:chf((c.p3aMax-c.p3aYear)*num(S.profile.marginal)/100)})); }
  G="cash"; if(c.worst&&c.worst.v<0) add("bad",t("ch_overdraft",{a:esc(c.worst.acc.name),m:MON()[c.months[c.worst.k]]}),t("ch_overdraft_d",{x:chf(c.worst.v)}));
  G="lamal"; S.policies.forEach(p=>{ const d=policyDeadline(p); if(d&&d.days>=0&&d.days<=75&&p.type!=="lamal") add(d.days<=30?"bad":"warn",t("ch_cancel",{t:L(POL_TYPES,p.type)+(p.insurer?" ("+esc(p.insurer)+")":""),d:fmtD(d.by)}),t("ch_cancel_d",{n:d.days})); });
  if(CM===10 && NOW.getDate()<=30) add("warn",t("ch_lamal_dl"),t("ch_lamal_dl_d"));
  G="accounts"; if(c.mortNext){ const [y,m]=c.mortNext.split("-").map(Number); const months=(y-CY)*12+(m-1-CM); if(months<=24) add("warn",t("ch_mort",{d:fmtYM(c.mortNext)}),t("ch_mort_d")); }
  G="family"; if(c.goalNeed>c.saving+Math.max(c.unalloc,0)+1){ const g=c.goals.filter(g=>g.rest>0).sort((a,b)=>b.need-a.need)[0]; if(g) add("warn",t("ch_goal",{g:esc(g.label),x:chf(g.need)}),t("ch_goal_d",{y:chf(c.saving+Math.max(c.unalloc,0))})); }
  return out;
}

function lineChart(series,{h=240,labels,colors,fmt=chf,widths=[],dash=[]}){
  const W=900,H=h,pl=62,pr=14,pt=14,pb=28;
  const all=series.flat().filter(isFinite); let mn=Math.min(0,...all), mx=Math.max(0,...all); if(mx===mn) mx+=1;
  const raw=(mx-mn)/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), nr=raw/mag, step=(nr<=1?1:nr<=2?2:nr<=2.5?2.5:nr<=5?5:10)*mag;
  mn=Math.floor(mn/step)*step; mx=Math.ceil(mx/step)*step; const ticks=Math.round((mx-mn)/step);
  const n=labels.length, x=i=>pl+(W-pl-pr)*(n===1?0.5:i/(n-1)), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g="";
  for(let k=0;k<=ticks;k++){const v=mn+step*k; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--axis)">${fmt(v)}</text>`;}
  if(mn<0) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--muted)"/>`;
  labels.forEach((l,i)=>{ if(n>14&&i%5) return; g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--axis)">${l}</text>`; });
  series.forEach((s,k)=>{ g+=`<polyline fill="none" style="stroke:${colors[k]}" stroke-width="${widths[k]||2.2}" ${dash[k]?'stroke-dasharray="5 4"':''} stroke-linejoin="round" points="${s.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`;
    if(n<=14) s.forEach((v,i)=>{ g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${(widths[k]||2.2)>3?4:3}" style="fill:${v<0?"var(--red)":colors[k]}"><title>${labels[i]} : ${fmt(v)} CHF</title></circle>`; }); });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">${g}</svg>`;
}

function renderLamal(){
  const costs=num(S.lamal.expected); document.getElementById("lamalExp").value=S.lamal.expected;
  const scen=[0,500,2000,5000,costs]; const bests=scen.map(s=>lamalBest(s)?.f);
  let h=`<thead><tr><th>${t("deductible")}</th><th class="num">${t("premium_m")}</th>${scen.map((s,i)=>`<th class="num">${i===4?`<span class="pill gold">${t("you")}</span> `:""}${chf(s)} ${t("costs")}</th>`).join("")}</tr></thead><tbody>`;
  FRANCHISES.forEach(f=>{ const p=num(S.lamal.primes[f]); h+=`<tr><td><b>${f}</b></td><td class="num"><input class="amt" type="number" step="1" data-fr="${f}" value="${S.lamal.primes[f]}" style="width:90px"></td>`+scen.map((s,i)=>`<td class="num ${bests[i]===f?"best":""}">${p>0?chf(lamalCost(f,p,s)):"–"}</td>`).join("")+"</tr>"; });
  document.getElementById("lamalTbl").innerHTML=h+"</tbody>";
  renderLamalVerdict();
}
function refreshLamalCells(){
  const costs=num(S.lamal.expected), scen=[0,500,2000,5000,costs], bests=scen.map(s=>lamalBest(s)?.f);
  document.querySelectorAll("#lamalTbl tbody tr").forEach((tr,ri)=>{ const f=FRANCHISES[ri], p=num(S.lamal.primes[f]);
    tr.querySelectorAll("td").forEach((td,ci)=>{ if(ci<2) return; const i=ci-2; td.textContent=p>0?chf(lamalCost(f,p,scen[i])):"–"; td.className="num"+(bests[i]===f?" best":""); }); });
  const ths=document.querySelectorAll("#lamalTbl thead th"); if(ths[6]) ths[6].innerHTML=`<span class="pill gold">${t("you")}</span> ${chf(costs)} ${t("costs")}`;
  renderLamalVerdict();
}
function renderLamalVerdict(){
  const costs=num(S.lamal.expected), best=lamalBest(costs), el=document.getElementById("lamalVerdict");
  if(!best){ el.innerHTML=`<p class="note">${t("lamal_need")}</p>`; document.getElementById("lamalBreak").innerHTML=""; return; }
  const worst=FRANCHISES.map(f=>({f,p:num(S.lamal.primes[f])})).filter(x=>x.p>0).map(x=>({...x,c:lamalCost(x.f,x.p,costs)})).sort((a,b)=>b.c-a.c)[0];
  el.innerHTML=`<div class="callout">${t("lamal_v1",{f:best.f,c:chf(best.cost),e:chf(costs),w:worst.f,d:chf(worst.c-best.cost)})}</div><p class="note mt">${t("lamal_v2",{x:chf(2500+QP_MAX)})}</p>
   <p class="mt"><a class="btn small" href="https://www.comparis.ch/krankenkassen" target="_blank" rel="noopener">comparis · LAMal ↗</a> <a class="btn small" href="https://www.priminfo.admin.ch" target="_blank" rel="noopener">priminfo ↗</a></p>`;
  const p300=num(S.lamal.primes[300]), p2500=num(S.lamal.primes[2500]);
  if(p300>0&&p2500>0){ let be=null; for(let x=0;x<=8000;x+=10){ if(lamalCost(300,p300,x)<=lamalCost(2500,p2500,x)){be=x;break;} }
    document.getElementById("lamalBreak").innerHTML = be!==null? t("lamal_be",{x:chf(be)}) : t("lamal_be2"); }
}

function renderP3aCalc(c){
  const P=S.profile, gap=Math.max(0,c.p3aMax-c.p3aYear), save=Math.min(c.p3aYear,c.p3aMax)*num(P.marginal)/100;
  const k=(l,v,h,cls="")=>`<div class="kpi"><div class="label">${l}</div><div class="val ${cls}" style="font-size:20px">${v}</div><div class="hint">${h}</div></div>`;
  document.getElementById("p3aKpis").innerHTML = k(t("p3a_paid"),chf(c.p3aYear),c.p3aYear>c.p3aMax+12?`<span class="neg">${t("p3a_over",{x:chf(c.p3aYear-c.p3aMax)})}</span>`:`${t("p3a_cap")} ${chf(c.p3aMax)}`,c.p3aYear>c.p3aMax+12?"neg":"")+k(t("p3a_taxsave"),chf(save),`${t("p3a_at")} ${num(P.marginal)} %`,"pos")+k(t("p3a_gap"),chf(gap),gap>0?`≈ ${chf(gap*num(P.marginal)/100)} CHF ${t("p3a_more_tax")}`:t("p3a_full"),gap>0?"neg":"pos");
  const years=Math.max(1,65-num(P.age)); const A3=S.accounts.filter(a=>a.type==="p3a");
  const scale = c.p3aYear>0 ? Math.min(1,c.p3aMax/c.p3aYear) : 1;
  const per=A3.map(a=>{ const ann=S.transfers.filter(x=>x.to===a.id).reduce((s,x)=>s+monthly(x),0)*12*scale; return {a,ann,s:fv(ann,num(a.ret??0.5),years,num(a.balance))}; });
  const mine=Array.from({length:years+1},(_,i)=>per.reduce((s,p)=>s+p.s[i],0));
  const allAcc=fv(Math.min(c.p3aYear,c.p3aMax),num(P.p3aRateAcc),years,A3.reduce((s,a)=>s+num(a.balance),0));
  per.forEach(p=>{ const el=document.querySelector(`[data-at65="${p.a.id}"]`); if(el) el.innerHTML=`<b>${chf(p.s[years])}</b>`; });
  document.getElementById("p3aChart").innerHTML = lineChart([mine,allAcc],{labels:mine.map((_,i)=>String(num(P.age)+i)),colors:["var(--gold)","#9a958a"],widths:[3,2],h:220,fmt:v=>Math.abs(v)>=1000?chf(v/1000)+"k":chf(v)})+`<p class="note">${t("p3a_res2",{a:chf(mine[years]),b:chf(allAcc[years])})}</p>`;
  const need=num(P.taxAnnual)/12;
  document.getElementById("taxBox").innerHTML = `<div class="callout mt">${t("tax_need",{a:chf(need),b:chf(c.taxProv)})} ${c.taxProv+0.5>=need?'<span class="pill green">OK</span>':`<span class="pill red">${t("missing")} ${chf(need-c.taxProv)}</span>`}</div><p class="note mt">${t("tax_tip")}</p>`;
}

function insLink(label){
  const s=(label||"").toLowerCase();
  if(/lamal|maladie|kranken|health|santé|compl/.test(s)) return "https://www.comparis.ch/krankenkassen";
  if(/auto|voiture|car|véhicule|fahrzeug|moto/.test(s)) return "https://www.comparis.ch/autoversicherung";
  if(/ménage|menage|rc|hausrat|haftpflicht|household|liability/.test(s)) return "https://www.comparis.ch/hausratversicherung";
  if(/vie|life|leben|décès/.test(s)) return "https://www.comparis.ch/lebensversicherung";
  if(/voyage|travel|reise/.test(s)) return "https://www.comparis.ch/reiseversicherung";
  if(/leasing|crédit|credit|kredit/.test(s)) return "https://www.comparis.ch/kredite";
  return "https://www.comparis.ch";
}

// ================= tax estimate =================
const TAX_K = 1.6;
function refTax(id,sit,kids){ const v=MUNIS[id]; if(!v) return null; if(sit==="married") return kids>0?{t:v[4],y:168000,kidsRef:2}:{t:v[3],y:168000,kidsRef:0}; return {t:v[2],y:84000,kidsRef:0}; }
function taxFor(id,Y){ const P=S.profile; const r=refTax(id,P.situation,num(P.kids)); if(!r||!r.t||Y<=0) return null; return r.t*Math.pow(Y/r.y,TAX_K); }
function taxCalc(c){
  c=c||calc(); const P=S.profile; const married=P.situation==="married";
  const sal=salaryCalc(); const Y = married ? num(P.hhGross) : (sal.annual||num(P.hhGross));
  const r=refTax(P.home.muni,P.situation,num(P.kids));
  if(!r||!r.t||Y<=0) return {ok:false};
  const base=r.t*Math.pow(Y/r.y,TAX_K); const marg=Math.min(0.45,TAX_K*base/Y);
  const cd=commuteDed(); const ded=[];
  if(cd.d) ded.push([t("tx_d_commute"),cd.d]); if(cd.r) ded.push([t("tx_d_meals"),cd.r]);
  const p3=Math.min(c.p3aYear,c.p3aMax); if(p3) ded.push([t("tx_d_3a"),p3]);
  if(num(P.lppBuy)) ded.push([t("tx_d_lpp"),num(P.lppBuy)]);
  const kd=(num(P.kids)-r.kidsRef)*6800; if(kd) ded.push([t("tx_d_kids"),kd]);
  if(num(S.family.kids)>0&&num(P.kids)>0){ const cc=Math.min(crecheCost(),25800*num(S.family.kids)); if(cc) ded.push([t("tx_d_care"),cc]); }
  const dsum=ded.reduce((a,d)=>a+d[1],0), saveT=dsum*marg, total=Math.max(0,base-saveT);
  const ratio = base>0 ? total/base : 1;
  const work = P.work.muni&&P.work.muni!==P.home.muni ? (taxFor(P.work.muni,Y)||0)*ratio : null;
  const kt=MUNIS[P.home.muni][1];
  const cheap=Object.entries(MUNIS).filter(([id,v])=>v[1]===kt&&id!==P.home.muni).map(([id,v])=>({id,n:`${v[0]}`,v:(taxFor(id,Y)||0)*ratio})).filter(x=>x.v>0).sort((a,b)=>a.v-b.v).slice(0,5);
  return {ok:true,Y,base,marg,ded,dsum,save:saveT,total,work,cheap,ref:r};
}

function policyDeadline(p){
  if(!p.end) return null; let end=new Date(p.end+"T12:00:00"); if(isNaN(end)) return null;
  const today=new Date(CY,CM,NOW.getDate(),12);
  const calcBy=e=>{ const isLast=new Date(e.getFullYear(),e.getMonth()+1,0).getDate()===e.getDate(); const n=num(p.notice);
    return isLast? new Date(e.getFullYear(),e.getMonth()-n+1,0,12) : new Date(e.getFullYear(),e.getMonth()-n,e.getDate(),12); };
  let by=calcBy(end), guard=0; while(by<today&&guard++<30){ end=new Date(end.getFullYear()+1,end.getMonth(),end.getDate(),12); if(end.getDate()!==new Date(p.end).getDate()) end=new Date(end.getFullYear(),end.getMonth(),0,12); by=calcBy(end); }
  return {by,end,days:Math.round((by-today)/86400000)};
}
function syncLiabs(){
  const keep=new Set();
  S.liabilities.forEach(l=>{ if(l.type!=="mortgage"||!l.account||!acc(l.account)) return;
    const mk=(kind,label,amount)=>{ let e=S.expenses.find(x=>x.liab===l.id&&x.kind===kind); if(!e){ e={id:uid(),liab:l.id,kind}; S.expenses.push(e); } Object.assign(e,{label,cat:"housing",amount:Math.round(amount*100)/100,freq:"m",month:1,account:l.account}); keep.add(e.id); };
    mk("int",t("lb_int")+" · "+(l.label||""),num(l.balance)*num(l.rate)/100/12);
    if(l.amortType!=="indirect"&&num(l.amort)>0) mk("amo",t("lb_amo")+" · "+(l.label||""),num(l.amort)/12); });
  S.expenses=S.expenses.filter(e=>!e.liab||keep.has(e.id));
}
function syncPolicies(){
  const ids=new Set(S.policies.map(p=>p.id));
  S.expenses=S.expenses.filter(e=>!e.policy||ids.has(e.policy));
  S.policies.forEach(p=>{
    let e=S.expenses.find(x=>x.policy===p.id);
    if(!e){ e={id:uid(),policy:p.id}; S.expenses.push(e); }
    const endM = p.end? (+p.end.slice(5,7)%12)+1 : 1;

const FEES = {ZG:0.6,ZH:0.4,AG:1.2,SG:1.9,BE:2.6,VS:2.8,LU:2.4,TI:2.5,BS:3.7,GE:4.5,JU:4.5,FR:4.7,VD:5.0,NE:5.0};

const PU_TYPES = ["current","savings","tax","securities","crypto","p3a","property","other"];
function puSources(c,mode){

    const def=["savings","securities","crypto","p3a"].includes(a.type); const st=src[key]||{}; const off=inv&&p3;
    const on=!off&&(st.on!==undefined?st.on:def); const amt=st.amt; const used=on?Math.min(avail,amt==null||amt===""?avail:num(amt)):0;
    out.push({key,kind:p3?"p3a":"cash",label:a.name,type:L(ACC_TYPES,a.type),avail,on,amt,used,off,jump:J(esc(a.name),"accounts",`#accBody tr[data-id="${a.id}"]`),liquid:["current","savings","tax"].includes(a.type)&&!a.shared}); });
  S.assets.filter(a=>a.type==="pension").forEach(a=>{ const key="l:"+a.id, avail=num(a.value)*c.shP(a), st=src[key]||{}, off=inv; const on=!off&&!!st.on, amt=st.amt;
    const used=on?Math.min(avail,amt==null||amt===""?avail:num(amt)):0;
    out.push({key,kind:"lpp",label:a.label,type:t("pu_lpp"),avail,on,amt,used,off,jump:J(esc(a.label),"accounts",`#assetBody tr[data-id="${a.id}"]`)}); });

function purchaseCalc(c,modeOverride){
  c=c||calc(); const U=S.purchase, mode=modeOverride||U.mode||"own", P=num(U.price), kt=U.canton||S.profile.canton||"VD", inv=mode==="invest";
  const feePct = (U.fee===null||U.fee===""||U.fee===undefined) ? (FEES[kt]??2.5) : num(U.fee); const F=P*feePct/100;
  const src=puSources(c,mode);
  const co = mode==="co" ? (S.cobuyers||[]) : [];
  const myTotal=src.reduce((a,s)=>a+s.used,0), myLpp=src.filter(s=>s.kind==="lpp").reduce((a,s)=>a+s.used,0);
  const coCash=co.reduce((a,b)=>a+num(b.cash),0), coLpp=inv?0:co.reduce((a,b)=>a+num(b.lpp),0), coInc=co.reduce((a,b)=>a+num(b.income),0);
  const total=myTotal+coCash+coLpp, lppUsed=myLpp+coLpp, cash=total-lppUsed;
  const eqPrice=Math.max(0,Math.min(P,total-F)), M=Math.max(0,P-eqPrice), hard=Math.max(0,cash-F);
  const mk=MARKET.mortgages.find(r=>String(r.y)===U.rateMode); const rate=U.rateMode==="custom"?num(U.rate):(mk?mk.avg:num(U.rate));
  const r1=Math.min(M,P*2/3), r2=Math.max(0,M-r1); const ay=Math.max(1,Math.min(15,65-num(S.profile.age)));
  const am=U.amortMode||"auto"; const amortY = am==="pct" ? M*num(U.amortPct)/100 : am==="chf" ? num(U.amortChf) : r2/ay;
  const maint=P*num(U.maint)/100, Y1int=M*rate/100, income=num(S.profile.hhGross)+coInc;
  const rentY=inv?num(U.rent)*12*(1-num(U.vac)/100):0, mgmt=rentY*num(U.mgmt)/100;

  const gross=P?num(U.rent)*12/P:0, net=P?(rentY-maint-mgmt)/P:0, roe=total?(rentY-Y1int-maint-mgmt)/total:0;
  const tenab = income>0 ? Math.max(0,M*0.05+amortY+P*0.01-(inv?rentY*0.8:0))/income : 9;
  const monthly=(Y1int+amortY+maint+mgmt)/12;

  const left=src.filter(s=>s.liquid).reduce((a,s)=>a+(s.avail-s.used),0);
  let buyers=[];

    buyers=[{name:t("co_me"),share:myShare,eq:myTotal,income:num(S.profile.hhGross),me:true},...co.map(b=>({name:b.name||"—",share:num(b.share),eq:num(b.cash)+num(b.lpp),income:num(b.income),id:b.id}))];
    buyers.forEach(b=>{ b.eqShare=total?b.eq/total*100:0; b.gap=b.eqShare-b.share; b.cost=monthly*b.share/100; b.debt=M*b.share/100; b.ratio=b.income>0?b.cost*12/b.income:0; }); }
  const ck=[]; const eqR=P?eqPrice/P:0;
  ck.push({k:"k_eq",l:inv?lvl(eqR,0.25,0.20):lvl(eqR,0.20,0.15),v:pct(eqR),d:t(inv?"k_eq_d_inv":"k_eq_d_own")});
  if(!inv) ck.push({k:"k_hard",l:hard>=P*0.1-1?"g":"r",v:chf(hard),d:"≥ "+chf(P*0.1)});
  ck.push({k:"k_fees",l:cash>=F?"g":"r",v:chf(F),d:`${decS(feePct.toFixed(1))} % · ${kt}`});
  ck.push({k:"k_tenab",l:lvl(tenab,0.33,0.38,false),v:pct(tenab),d:t("k_tenab_d")+" · "+J(t("pf_hh").toLowerCase(),"profile",'[data-path="profile.hhGross"]')});
  ck.push({k:"k_cush",l:lvl(c.mySpend?left/c.mySpend:9,3,1),v:chf(left),d:t("k_cush_d")});
  if(inv){ ck.push({k:"k_gross",l:lvl(gross,0.04,0.03),v:pct(gross,2),d:t("k_gross_d")}); ck.push({k:"k_cf",l:lvl(cfPost,0,-300),v:chf(cfPost),d:t("k_cf_d")}); }
  else { const myCost=mode==="co"&&buyers[0]?buyers[0].cost:monthly; ck.push({k:"k_budget",l:lvl(myCost/(capacity||1),1,1.2,false),v:chf(myCost),d:t("k_budget_d2",{h:J(chf(housingNow),"budget","#expBody"),u:J(chf(Math.max(0,c.unalloc)),"budget","#incBody"),x:chf(capacity)})}); }
  if(mode==="co"&&buyers.length>1){ const g=Math.max(...buyers.map(b=>Math.abs(b.gap))); ck.push({k:"k_coeq",l:lvl(g,5,15,false),v:decS(g.toFixed(0))+" pts",d:t("k_coeq_d")}); }
  const overall=worst(ck.map(x=>x.l));
  const N=Math.max(1,Math.min(40,num(U.years)||20)); let b=M, ci=0, ca=0, milestone=null; const rows=[];
  for(let y=1;y<=N;y++){ const start=b, i=b*rate/100; let a = am==="auto" ? Math.min(amortY,Math.max(0,b-P*2/3)) : Math.min(amortY,b); b-=a; ci+=i; ca+=a;
    if(milestone===null&&r2>0&&b<=P*2/3+1) milestone=CY+y;
    const cf=inv?(rentY-i-maint-mgmt-a-Math.max(0,rentY-i-Math.max(maint,0.2*rentY)-mgmt)*num(S.profile.marginal)/100)/12:-(i+a+maint)/12;
    const lv = inv? lvl(cf,0,-300) : lvl(((i+a+maint)/12)*(mode==="co"&&buyers[0]?buyers[0].share/100:1)/(capacity||1),1,1.2,false);
    const val=P*Math.pow(1+num(U.growth)/100,y); rows.push({y,start,i,a,m:maint+mgmt,b,cf,lv,val,eq:val-b}); }
  const totalCost=F+ci+(maint+mgmt)*N-(inv?rentY*N:0);
  const g=num(U.growth), valN=rows.length?rows[rows.length-1].val:P, gain=valN-P;
  return {g,valN,gain,mode,P,kt,feePct,F,src,total,cash,lppUsed,eqPrice,M,hard,rate,r1,r2,ay,amortY,am,maint,mgmt,Y1int,monthly,tenab,N,rows,ci,ca,b,milestone,totalCost,housingNow,capacity,left,income,rentY,cfPre,cfPost,taxRent,gross,net,roe,buyers,ck,overall};
}

// ================= situation (profile drives the layout) =================
const SIT=["joint","savings","taxacc","p3a","sec","vehicle","owner","project","kids","valuables"];
function deriveHas(){ const A=S.accounts||[]; return {joint:A.some(a=>a.shared),savings:A.some(a=>a.type==="savings"),taxacc:A.some(a=>a.type==="tax"),p3a:A.some(a=>a.type==="p3a"),sec:A.some(a=>a.type==="securities"||a.type==="crypto"),
  vehicle:(S.assets||[]).some(a=>a.type==="vehicle")||(S.liabilities||[]).some(l=>l.type==="leasing")||(S.expenses||[]).some(e=>e.cat==="car"),owner:(S.assets||[]).some(a=>a.type==="property")||(S.liabilities||[]).some(l=>l.type==="mortgage"),
  project:false,kids:num(S.profile&&S.profile.kids)>0||num(S.family&&S.family.kids)>0&&false,valuables:(S.valuables||[]).length>0}; }
function hasF(k){ const h=S.profile.has||{}; if(k==="debts") return hasF("owner")||hasF("vehicle")||(S.liabilities||[]).length>0; if(k==="assets") return hasF("owner")||hasF("vehicle")||(S.assets||[]).length>0; if(k==="sec") return h.sec!==undefined?!!h.sec:!!h.securities; return !!h[k]; }
function applyFeatures(){ document.querySelectorAll("[data-feat]").forEach(el=>{ const f=el.dataset.feat, neg=f.startsWith("!"), on=hasF(neg?f.slice(1):f); el.style.display=(neg?!on:on)?"":"none"; }); }
function renderSituation(){
  document.getElementById("pfSit").innerHTML=SIT.map(k=>`<button class="sit ${hasF(k)?"on":""}" data-sit="${k}"><span class="tick">${hasF(k)?"✓":""}</span><div><b>${t("s_"+k)}</b><span>${t("s_"+k+"_d")}</span></div></button>`).join("");
}
function toggleSit(k){
  const on=!hasF(k); S.profile.has={...(S.profile.has||{}),[k]:on};
  const me=(S.accounts.find(a=>a.type==="current"&&!a.shared)||S.accounts[0]); const joint=hasF("joint");
  const addAcc=(type,name,extra={})=>{ if(!S.accounts.some(a=>a.type===type&&(!extra.match||extra.match(a)))) S.accounts.push({id:"a_"+uid(),name,type,shared:false,balance:0,...extra.fields}); };
  if(on){
    if(k==="savings") addAcc("savings",t("s_savings").replace(/\(s\)/,""));
    if(k==="taxacc") addAcc("tax",t("s_taxacc"));
    if(k==="p3a") addAcc("p3a","3a",{fields:{strategy:"account",ret:0.5}});
    if(k==="sec") addAcc("securities",t("q_sec").replace("+ ",""));
    if(k==="vehicle"&&!S.accounts.some(a=>/voiture|auto|car/i.test(a.name))) S.accounts.push({id:"a_"+uid(),name:t("acc_car"),type:"current",shared:joint,balance:0});
    if(k==="owner"){ if(!S.assets.some(a=>a.type==="property")) S.assets.push({id:uid(),label:t("asset_home"),type:"property",value:0,share:joint?50:100});
      if(!S.accounts.some(a=>a.type==="property")) S.accounts.push({id:"a_"+uid(),name:t("acc_prop"),type:"property",shared:joint,balance:0});
      if(!S.liabilities.some(l=>l.type==="mortgage")) S.liabilities.push({id:uid(),label:t("lb_int").split(" ")[0]+"",type:"mortgage",balance:0,rate:0,end:"",amort:0,amortType:"direct",account:(S.accounts.find(a=>a.type==="property")||{}).id,share:joint?50:100}); }
    if(k==="kids"&&!(num(S.profile.kids)>0)) { S.profile.kids=1; S.family.kids=1; S.family.allocKids=1; }
    if(k==="joint"){ S.accounts.forEach(a=>{ if(a.wasShared){ a.shared=true; delete a.wasShared; } }); if(!S.accounts.some(a=>a.shared)) S.accounts.splice(1,0,{id:"a_"+uid(),name:t("q_joint").replace("+ ",""),type:"current",shared:true,balance:0}); }
  } else {
    if(k==="joint") S.accounts.forEach(a=>{ if(a.shared){ a.shared=false; a.wasShared=true; } });
    if(k==="kids"){ S.profile.kids=0; }
  }
  S.settings.tabs={...(S.settings.tabs||{})}; if(k==="project") delete S.settings.tabs.purchase; if(k==="sec") delete S.settings.tabs.market;
  renderAll(); save();
}
// ================= collapsible cards =================
function setupCards(){
  document.querySelectorAll("main .card").forEach((card,i)=>{
    if(card.dataset.cardk||card.classList.contains("kpi")) return; const h=card.querySelector("h2"); if(!h) return;
    const sec=card.closest("section"); const key=(sec?sec.id:"x")+":"+(h.dataset.i18n||i);
    card.dataset.cardk=key; let head=h; while(head.parentElement&&head.parentElement!==card) head=head.parentElement;
    if(head===h){ const wrap=document.createElement("div"); wrap.className="row"; wrap.style.marginBottom="12px"; h.parentElement.insertBefore(wrap,h); h.style.margin="0"; wrap.appendChild(h); const hb=wrap.nextElementSibling; if(hb&&hb.classList.contains("help-btn")) wrap.appendChild(hb); const sp=document.createElement("span"); sp.className="spacer"; wrap.appendChild(sp); head=wrap; }
    head.classList.add("card-head");
    const b=document.createElement("button"); b.className="card-tog"; b.textContent="▾"; b.title="Replier / déplier";
    head.appendChild(b);
    const tog=()=>{ card.classList.toggle("collapsed"); S.settings.collapsed={...(S.settings.collapsed||{}),[key]:card.classList.contains("collapsed")}; save(); };
    b.addEventListener("click",e=>{ e.stopPropagation(); tog(); }); h.addEventListener("click",e=>{ if(e.target===h) tog(); });
    if((S.settings.collapsed||{})[key]) card.classList.add("collapsed");
  });
}
// ================= jump to a field from anywhere =================
const J=(txt,tab,sel)=>`<a class="jump" data-jump="${tab}|${sel.replace(/"/g,"&quot;")}">${txt}</a>`;
function jumpTo(tab,sel){
  if(tab==="budget"&&UI.filter!=="all"){ UI.filter="all"; renderBudgetTables(); refresh(); }
  openTab(tab);
  setTimeout(()=>{ const el=[...document.querySelectorAll(`#tab-${tab} ${sel}`)][0]||document.querySelector(sel); if(!el) return;
    const card=el.closest(".card"); if(card&&card.classList.contains("collapsed")) card.classList.remove("collapsed");
    el.scrollIntoView({behavior:"smooth",block:"center"}); const tgt=el.matches("input,select,textarea")?el:el.querySelector("input,select")||el;
    setTimeout(()=>{ try{ tgt.focus({preventScroll:true}); }catch(_){} const fl=el.closest("tr")||el.closest(".field")||el; fl.classList.remove("flash"); void fl.offsetWidth; fl.classList.add("flash"); },350); },60);
}
document.addEventListener("click",e=>{ const j=e.target.closest("[data-jump]"); if(j){ e.preventDefault(); const [tab,sel]=j.dataset.jump.split("|"); jumpTo(tab,sel); } const st=e.target.closest("[data-sit]"); if(st) toggleSit(st.dataset.sit); });

// ================= migration / normalize =================
const V1CAT = {"Logement":"housing","Santé":"health","Transport":"transport","Alimentation":"food","Télécom & médias":"telecom","Assurances":"insurance","Impôts":"taxes","Enfants":"kids","Loisirs & vacances":"leisure","Autres":"other"};
function migrateV1(o){
  const d=EMPTY(); const p=o.profile||{};
  const accounts=[{id:"a_me",name:"Compte courant",type:"current",shared:false,balance:num(p.checking)},{id:"a_sav",name:"Épargne",type:"savings",shared:false,balance:num(p.liquid)},{id:"a_3a",name:"3a",type:"p3a",shared:false,balance:num(p.p3aBalance)}];
  const transfers=[], expenses=[];
  (o.expenses||[]).forEach(e=>{ if(e.cat==="Prévoyance (3a)") transfers.push({id:e.id,label:e.label,from:"a_me",to:"a_3a",amount:e.amount,freq:e.freq,month:e.month});
    else if(e.cat==="Épargne") transfers.push({id:e.id,label:e.label,from:"a_me",to:"a_sav",amount:e.amount,freq:e.freq,month:e.month});
    else expenses.push({...e,cat:V1CAT[e.cat]||"other",account:"a_me"}); });
  return {...d,profile:{...d.profile,...p},accounts,incomes:(o.incomes||[]).map(i=>({...i,account:"a_me"})),expenses,transfers,lamal:o.lamal||d.lamal};
}
function normalize(o){
  if(!o.v||o.v<2) o=migrateV1(o);
  const d=EMPTY();
  const op=o.profile||{}; const SITMAP={"Célibataire":"single","En couple":"couple","Marié·e":"married","Famille monoparentale":"single"}; if(SITMAP[op.situation]) op.situation=SITMAP[op.situation];
  const r={...d,...o,settings:{...d.settings,...(o.settings||{})},profile:{...d.profile,...op,home:{...d.profile.home,...(op.home||{})},work:{...d.profile.work,...(op.work||{})},commute:{...d.profile.commute,...(op.commute||{})}},purchase:{...d.purchase,...(o.purchase||{}),use:{...d.purchase.use,...((o.purchase||{}).use||{})}},salary:{...d.salary,...(o.salary||{})},family:{...d.family,...(o.family||{})},
    lamal:{...d.lamal,...(o.lamal||{}),primes:{...d.lamal.primes,...((o.lamal||{}).primes||{})}}};
  ["accounts","assets","liabilities","incomes","transfers","expenses","journal","goals","policies","valuables","cobuyers","salExtra","salBonus","salRefunds","whatif","puExtra"].forEach(k=>{ if(!Array.isArray(r[k])) r[k]=(o.v&&o.salExtra?[]:d[k])||[]; });
  if(!r.accounts.length) r.accounts=d.accounts;
  const ids=new Set(r.accounts.map(a=>a.id));
  ["incomes","expenses","journal"].forEach(k=>r[k].forEach(x=>{ if(!ids.has(x.account)) x.account=r.accounts[0].id; if(x.cat&&!CAT_LABELS[x.cat]) x.cat="other"; }));
  if(!o.salExtra){ const x=[]; const so=o.salary||{}; if(num(so.ijm)>0) x.push({id:uid(),label:"IJM maladie",mode:"pct",value:num(so.ijm)}); if(num(so.other)>0) x.push({id:uid(),label:"Autres retenues",mode:"chf",value:num(so.other)}); if(r.profile.canton==="VD") x.unshift({id:uid(),label:"PC Familles (VD)",mode:"pct",value:0.09}); r.salExtra=x; r.salary.ijm=0; r.salary.other=0; }
  if(o.purchase&&o.purchase.use&&!o.purchase.src){ const U=o.purchase, src={}; r.accounts.forEach(a=>{ if(a.type==="savings") src["a:"+a.id]={on:!!U.use.sav}; if(a.type==="securities"||a.type==="crypto") src["a:"+a.id]={on:!!U.use.sec}; if(a.type==="p3a") src["a:"+a.id]={on:!!U.use.p3a}; });
    r.assets.filter(a=>a.type==="pension").forEach((a,i)=>{ if(i===0) src["l:"+a.id]={on:!!U.use.lpp,amt:U.lpp||null}; }); r.purchase.src=src; if(num(U.gift)>0&&!(o.puExtra||[]).length) r.puExtra=[{id:uid(),label:"Apport partenaire / donation",amount:num(U.gift),kind:"cash"}]; }
  if(num(r.salary.source)>0){ r.salExtra=[...(r.salExtra||[]),{id:uid(),label:"Impôt à la source",mode:"pct",value:num(r.salary.source)}]; r.salary.source=0; }
  r.v=2; return r;
}

    const p3=S.accounts.filter(a=>a.type==="p3a").reduce((a,x)=>a+num(x.balance),0)+c.p3aYear*Math.min(yrs,Math.max(0,65-age));

  if(X.type==="retire"){ const lam=(S.policies||[]).filter(p=>p.type==="lamal").reduce((a,p)=>a+num(p.premium)*(FREQF[p.freq]??1),0); if(lam>0) adj.push([t("sc_adj_acc"),lam*0.07]); }

  r.curRest=incFull-c.mySpend-c.saving; r.rest=r.newInc-r.newSpend-r.newSaving; r.restNoSave=r.newInc-r.newSpend;
  r.cushion=S.accounts.filter(a=>["current","savings"].includes(a.type)).reduce((a,x)=>a+num(x.balance)*c.shA(x),0);
  r.runway=r.restNoSave<0?r.cushion/(-r.restNoSave):null;
  if(X.type==="loss"){ const after=incFull-curSal-r.newSpend; r.after=after; r.afterRunway=after<0?Math.max(0,r.cushion+Math.min(0,r.restNoSave)*r.months)/(-after):null; }

  const gap=Math.max(0,-r.restNoSave), items=S.expenses.map(e=>({e,m:monthly(e)*(c.share[e.id]??1),f:/leasing|crédit|credit|kredit|hypoth|mortgage|amort|loyer|rent\b|miete/i.test(e.label||"")||e.liab||e.policy?0:(FLEX[e.cat]??1)})).filter(x=>x.m>1&&x.f>0);

  r.housingPct=r.newInc>0?c.byCat.housing/r.newInc:0;
  return r;
}

let dbRef=null, db=null, saveTimer=null, writing=false, pending=false;
const LS_KEY="francclair.v2"; // kept for continuity with saved data

// ================= history (undo / redo / versions) =================
let HIST=[], REDO=[], lastJSON=null, histTimer=null;
const HIST_KEY="cime.history";
const stateStr = () => { const {settings,...rest}=S; return JSON.stringify(rest); };
const LISTS={accounts:"accounts",incomes:"incomes",expenses:"expenses",transfers:"transfers",journal:"journal_title",goals:"goals",policies:"ins_title",valuables:"valuables",assets:"assets",liabilities:"liabilities"};
const OBJS={profile:"tab_profile",salary:"tab_salary",family:"tab_family",purchase:"tab_purchase",lamal:"tab_lamal"};
const fv2 = v => v==null||v===""?"–":typeof v==="number"?chf(v,v%1?2:0):typeof v==="boolean"?(v?"✓":"✕"):typeof v==="object"?"…":String(v).slice(0,40);
const fname = k => I["c_"+k]?t("c_"+k):k;
function diffStates(a,b){
  const out=[];
  for(const [k,lbl] of Object.entries(LISTS)){
    const A=new Map((a[k]||[]).map(x=>[x.id,x])), B=new Map((b[k]||[]).map(x=>[x.id,x]));
    const nm=x=>x.label||x.name||L(POL_TYPES,x.type)||x.id;
    B.forEach((x,id)=>{ if(x.policy||x.liab) return; if(!A.has(id)) out.push(`${t(lbl)} · ${esc(nm(x))} : ${t("f_added")}`); });
    A.forEach((x,id)=>{ if(x.policy||x.liab) return; if(!B.has(id)) out.push(`${t(lbl)} · ${esc(nm(x))} : ${t("f_removed")}`); });
    B.forEach((x,id)=>{ const y=A.get(id); if(!y||x.policy||x.liab) return; new Set([...Object.keys(x),...Object.keys(y)]).forEach(f=>{ if(f==="id") return; if(JSON.stringify(x[f])!==JSON.stringify(y[f])) out.push(`${t(lbl)} · ${esc(nm(x))} — ${fname(f)} : ${esc(fv2(y[f]))} → <b>${esc(fv2(x[f]))}</b>`); }); });
  }
  const walk=(o1,o2,path,lbl)=>{ new Set([...Object.keys(o1||{}),...Object.keys(o2||{})]).forEach(f=>{ const v1=(o1||{})[f], v2=(o2||{})[f];
    if(v1&&v2&&typeof v1==="object"&&typeof v2==="object") walk(v1,v2,path.concat(f),lbl);
    else if(JSON.stringify(v1)!==JSON.stringify(v2)) out.push(`${t(lbl)} — ${path.concat(f).join(".")} : ${esc(fv2(v1))} → <b>${esc(fv2(v2))}</b>`); }); };
  for(const [k,lbl] of Object.entries(OBJS)) walk(a[k],b[k],[],lbl);
  return out;
}
function persistHist(){ for(let n=HIST.length;n>0;n=Math.floor(n/2)){ try{ localStorage.setItem(HIST_KEY,JSON.stringify(HIST.slice(-Math.min(40,n)))); return; }catch(_){ } } }
function recordHistory(note){
  clearTimeout(histTimer);
  const cur=stateStr(); if(lastJSON===null){ lastJSON=cur; return; } if(cur===lastJSON) return;
  let ch=[]; try{ ch=diffStates(JSON.parse(lastJSON),JSON.parse(cur)); }catch(_){}
  if(note) ch.unshift(note);
  HIST.push({ts:Date.now(),changes:ch,before:lastJSON}); if(HIST.length>40) HIST.shift();
  REDO=[]; lastJSON=cur; persistHist(); updateUndo(); if(typeof updateBkHints==="function") updateBkHints();
}
function applyStateStr(str){ const st=JSON.parse(str); S={...normalize(st),settings:S.settings}; lastJSON=stateStr(); renderAll(); clearTimeout(histTimer); clearTimeout(saveTimer); saveTimer=setTimeout(flush,300); try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(_){} }
function undo(){ recordHistory(); const e=HIST.pop(); if(!e) return; REDO.push({ts:Date.now(),changes:e.changes,after:stateStr()}); applyStateStr(e.before); persistHist(); updateUndo(); toast(t("undone")); }
function redo(){ const e=REDO.pop(); if(!e) return; HIST.push({ts:e.ts,changes:e.changes,before:stateStr()}); applyStateStr(e.after); persistHist(); updateUndo(); toast(t("redone")); }
function restoreBefore(i){ recordHistory(); const e=HIST[i]; if(!e) return; const d=new Date(e.ts); const before=stateStr();
  applyStateStr(e.before); HIST.push({ts:Date.now(),changes:[t("hist_restored",{d:fmtD(d)+" "+d.toTimeString().slice(0,5)})],before}); REDO=[]; persistHist(); updateUndo(); renderHist(); }
function updateUndo(){ const u=document.getElementById("btnUndo"), r=document.getElementById("btnRedo"); if(u) u.disabled=!HIST.length; if(r) r.disabled=!REDO.length; }
function renderHist(){ const el=document.getElementById("histList");
  if(!HIST.length){ el.innerHTML=`<p class="note">${t("hist_empty")}</p>`; return; }
  el.innerHTML=HIST.map((e,i)=>({e,i})).reverse().map(({e,i})=>{ const d=new Date(e.ts); const ch=e.changes.length?e.changes:["…"];
    return `<div class="hist-item"><div class="row"><b>${fmtD(d)} · ${d.toTimeString().slice(0,5)}</b><span class="spacer"></span><button class="btn small" data-hrestore="${i}">${t("hist_restore")}</button></div><ul>${ch.slice(0,6).map(c=>`<li>${c}</li>`).join("")}${ch.length>6?`<li>${t("more_changes",{n:ch.length-6})}</li>`:""}</ul></div>`; }).join(""); }
function toast(msg){ let el=document.getElementById("toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:20;transition:opacity .3s"; document.body.appendChild(el); } el.textContent=msg; el.style.opacity="1"; clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity="0",1600); }

const BK_KEY="cime.lastBackup", BK_DAYS=30;
let FRESH=false; // no saved data found at start (first visit or cleared browser)
function bkLastTs(){ try{ return +localStorage.getItem(BK_KEY)||0; }catch(_){ return 0; } }
function renderBkLast(){ const ts=bkLastTs(), el=document.getElementById("bkLast"); if(el) el.textContent=ts?t("bk_last",{d:fmtD(new Date(ts))+" "+new Date(ts).toTimeString().slice(0,5)}):t("bk_never"); }
function bkFile(){ recordHistory(); return JSON.stringify({app:"cime",format:2,exported:new Date().toISOString(),state:S,history:HIST},null,1); }
async function downloadBackup(msgEl){
  const fn=`cime-sauvegarde-${new Date().toISOString().slice(0,10)}.json`, data=bkFile(); let ok=false;
  try{ const dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){ try{ await dl.save({filename:fn,data}); ok=true; }catch(e){ if(msgEl) msgEl.textContent=e&&e.code==="declined"?t("exp_declined"):t("dl_blocked"); } }
    else throw 0; }catch(_){ if(!ok){ try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); ok=true; }catch(_){ if(msgEl) msgEl.textContent=t("dl_blocked"); } } }
  if(ok){ try{ localStorage.setItem(BK_KEY,String(Date.now())); }catch(_){} if(msgEl) msgEl.textContent=t("bk_saved",{f:fn}); renderBkLast(); updateBkHints(); }
}
function restoreBackup(text,msgEl){
  let o; try{ o=JSON.parse(text); }catch(_){ if(msgEl) msgEl.textContent=t("invalid"); return false; }
  const st=o&&o.app==="cime"&&o.state?o.state:o; if(!st||!st.profile||!Array.isArray(st.expenses)){ if(msgEl) msgEl.textContent=t("invalid"); return false; }
  recordHistory(); const before=stateStr(), keepSettings=S.settings;
  S=normalize(st); if(!st.settings) S.settings=keepSettings;
  const H=Array.isArray(o.history)?o.history.filter(e=>e&&e.ts&&typeof e.before==="string"):[];
  HIST=H.slice(-39); HIST.push({ts:Date.now(),changes:[o.exported?t("bk_restored_h",{d:fmtD(new Date(o.exported))}):t("bk_restored_old")],before}); REDO=[];
  lastJSON=stateStr(); persistHist(); updateUndo(); renderAll(); save(); clearTimeout(histTimer);
  FRESH=false; try{ localStorage.setItem(BK_KEY,String(Date.now())); }catch(_){}
  updateBkHints(); renderBkLast();
  const msg=o.exported?t("bk_restored",{n:H.length,d:fmtD(new Date(o.exported))}):t("bk_restored_old"); if(msgEl) msgEl.textContent=msg; toast(msg); return true;
}
function updateBkHints(){
  const ts=bkLastTs(), hasData=(S.expenses||[]).length+(S.incomes||[]).length>0, changed=HIST.some(e=>e.ts>ts);
  const due=hasData&&changed&&(!ts||Date.now()-ts>BK_DAYS*864e5)&&!FRESH;
  const dot=document.getElementById("bkDot"); if(dot) dot.style.display=due?"":"none";
  const w=document.getElementById("bkWelcome"); if(w) w.style.display=FRESH&&!sessionStorageGet("bkW")?"":"none";
  const r=document.getElementById("bkRemind"); if(r){ r.style.display=due&&!sessionStorageGet("bkR")?"":"none"; document.getElementById("bkRemindTxt").textContent=ts?t("bk_remind",{n:Math.floor((Date.now()-ts)/864e5)}):t("bk_remind_never"); }
}
function sessionStorageGet(k){ try{ return sessionStorage.getItem(k); }catch(_){ return UI["_"+k]; } }
function sessionStorageSet(k){ try{ sessionStorage.setItem(k,"1"); }catch(_){ UI["_"+k]="1"; } }

async function flush(){
  if(!dbRef) return; if(writing){ pending=true; return; }
  writing=true; setStatus(false,"saving");
  try{ await dbRef.set({state:JSON.stringify(S),updated:new Date().toISOString()}); setStatus(true,"save_cloud"); }
  catch(e){ setStatus(false,"save_local"); if(e&&e.code==="invalid_argument") dbRef=null; }
  writing=false; if(pending){ pending=false; flush(); }
}
async function initDb(){
  try{
    if(!window.claude||!claude.use) return;
    db=await claude.use("db"); const user=await claude.use("user");
    if(!db) return;
    // market snapshot written by Claude (optional, overrides embedded data when newer)
    try{ const ms=await db.doc("market/latest").get(); if(ms.exists){ const m=JSON.parse(ms.data().json||"null"); if(m&&m.date&&m.date>=MARKET.date){ MARKET={...MARKET,...m}; renderMarket(calc()); } } }catch(_){}
    if(!user) return; const id=await user.id(); if(!id) return;
    dbRef=db.doc("data/users/"+id+"/budget");
    const timer=setTimeout(()=>setStatus(false,"save_unreach"),10000);
    const snap=await dbRef.get(); clearTimeout(timer);
    if(snap.exists){ const d=snap.data(); if(d&&d.state){ S=normalize(JSON.parse(d.state)); renderAll(); lastJSON=stateStr(); FRESH=false; updateBkHints(); } setStatus(true,"save_cloud"); }
    else { setStatus(true,"save_cloud"); flush(); }
  }catch(e){ setStatus(false,"save_local"); }
}
(function boot(){
  try{ const raw=localStorage.getItem(LS_KEY)||localStorage.getItem("francclair.v1"); if(raw) S=normalize(JSON.parse(raw)); else FRESH=true; }catch(_){ FRESH=true; }

let aiCtl=null;
function sysPrompt(){
  const lang={fr:"français",en:"English",de:"Deutsch (Schweizer Schreibweise, ss statt ß)"}[S.settings.lang];
  return `Tu es un conseiller budgétaire suisse exigeant mais bienveillant (tutoiement). On te donne le budget d'un ménage (CHF). Réponds en ${lang}.
- Max ~380 mots. Titres courts précédés de "## ", puces "- ".
- Commence par un verdict en 2 phrases. Puis "## 5 challenges" : 5 actions concrètes, CHIFFRÉES (CHF/mois ou /an), classées par impact, spécifiques à la Suisse (3a plafond 2026 7 258 CHF avec LPP / 36 288 sans ; franchise LAMal et changement de caisse avant le 30.11 ; subsides LAMal cantonaux ; intérêt rémunératoire sur acomptes d'impôts ; renouvellement hypothécaire vs taux du marché fournis ; leasing ; frais bancaires ; assurances via comparateur ; répartition des dépenses communes au prorata des revenus ; frais de garde déductibles).
- Puis "## À vérifier" : 2–3 hypothèses fragiles.
- N'invente pas de chiffres officiels ; dis "à vérifier" si incertain. Pas de recommandation de produit financier nommé.`;
}
function mdLite(s){ return esc(s).replace(/^## (.*)$/gm,"<h4>$1</h4>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
async function runAI(q){
  const out=document.getElementById("aiOut"); out.dataset.used="1";
  let sample=null; try{ sample = window.claude&&claude.use ? await claude.use("sample") : null; }catch(_){}
  if(aiCtl) aiCtl.abort(); aiCtl=new AbortController();
  const prompt0=()=>sysPrompt()+"\n\nBUDGET (JSON):\n"+JSON.stringify(aiPayload())+"\n\n"+(q?("QUESTION : "+q+"\nRéponds d'abord à la question, chiffres à l'appui, puis 2–3 challenges liés."):"Challenge ce budget.");
  if(!sample){ // hosted outside Claude: serverless function (Netlify)
    out.textContent=t("coach_busy");
    try{ const r=await fetch("/.netlify/functions/coach",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:prompt0()}),signal:aiCtl.signal});
      if(r.status===501){ out.textContent=t("coach_nokey"); return; } if(!r.ok) throw new Error(r.status); const j=await r.json(); out.innerHTML=mdLite(j.text||""); }
    catch(e){ if(e&&e.name==="AbortError") return; out.textContent=t("coach_na"); }
    return; }
  out.textContent=t("coach_busy");
  const prompt=sysPrompt()+"\n\nBUDGET (JSON):\n"+JSON.stringify(aiPayload())+"\n\n"+(q?("QUESTION : "+q+"\nRéponds d'abord à la question, chiffres à l'appui, puis 2–3 challenges liés."):"Challenge ce budget.");
  try{ const r=await sample(prompt,{signal:aiCtl.signal,cache:false,modelTier:"default",onText:({text})=>{ out.innerHTML=mdLite(text); }}); out.innerHTML=mdLite(r.text); }
  catch(e){ if(e&&e.name==="AbortError") return; out.textContent = e&&e.code==="not_granted"?t("coach_na"):e&&e.code==="rate_limited"?t("coach_rl"):t("coach_err"); }
}
document.getElementById("aiGo").onclick=()=>runAI("");
document.getElementById("aiAsk").onclick=()=>{ const q=document.getElementById("aiQ").value.trim(); if(q) runAI(q); };
